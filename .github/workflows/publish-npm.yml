name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: '必须与所选提交的 package.json 版本完全一致'
        required: true
        type: string
        default: '0.1.0'
      verify_only:
        description: '仅验证并保存候选包，不发布 npm'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: 验证并打包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      dist_tag: ${{ steps.pack.outputs.dist_tag }}
      filename: ${{ steps.pack.outputs.filename }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - name: 读取本次运行提交
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 固定 npm 版本
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org/

      - name: 安装锁定依赖
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: 编译并运行离线回归
        run: npm test

      - name: 打包并核对版本、白名单和完整性
        id: pack
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-package/pack.json"
          node scripts/verify-package.mjs "$RUNNER_TEMP/npm-package/pack.json" "$RUNNER_TEMP/npm-package"

      - name: 隔离安装同一候选包并验证 ESM 与类型
        env:
          RELEASE_FILENAME: ${{ steps.pack.outputs.filename }}
        run: |
          node scripts/smoke-package.mjs "$RUNNER_TEMP/npm-package/$RELEASE_FILENAME" "$RUNNER_TEMP/npm-consumer"

      - name: 保存已验证的候选包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: OIDC 发布并核验
    if: ${{ !inputs.verify_only }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 读取同一提交的发布脚本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 固定支持 OIDC 的 npm
        run: npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org/

      - name: 获取已验证的同一候选包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package

      - name: 通过 OIDC 发布并只读核验 registry
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          RELEASE_FILENAME: ${{ needs.verify.outputs.filename }}
          RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: node scripts/publish-package.mjs npm-package
